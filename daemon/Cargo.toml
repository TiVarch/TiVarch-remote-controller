[package]
name = "tivarch-remote-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "tivarch_remote_daemon"
path = "src/lib.rs"

[[bin]]
name = "tivarch-remote-daemon"
path = "src/main.rs"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Web Server & WebSocket (Wi-Fi Layer)
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
mdns-sd = "0.13"

# Linux Kernel Input Device Emulation
evdev = { version = "0.12", features = ["tokio"] }

# Bluetooth Low Energy (BlueZ D-Bus GATT Server)
bluer = { version = "0.17", features = ["full", "bluetoothd"] }

# Serialization & Protocols
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Network & Utilities
local-ip-address = "0.6"
qrcode = "0.14"

# File System & Storage
dirs = "5.0"
tempfile = "3.12"

# Error Handling & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
